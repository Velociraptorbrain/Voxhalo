name: Build VoxHalo (macOS)
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign (ad-hoc) and package
        run: bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VoxHalo-macOS
          path: dist/*
